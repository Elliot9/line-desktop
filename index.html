<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#eef3f0" />
    <title>LINE Desktop · 通訊，簡單一點。</title>
    <style>
      :root {
        --green: #06b35d;
        --green-dark: #008a48;
        --ink: #26332e;
        --muted: #939c97;
        --line: #edf0ee;
        --canvas: #eaf0f1;
        --rail: #27342f;
        --font: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eef3f0;
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", sans-serif;
        font-size: var(--font);
        height: 100vh;
        overflow: hidden;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #04a85a;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid #9cddbd;
        outline-offset: 0;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:hover {
        filter: brightness(0.98);
      }
      a {
        color: var(--green-dark);
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      button svg {
        pointer-events: none;
      }
      .presentation {
        height: 88px;
        max-width: 1536px;
        margin: auto;
        padding: 0 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .wordmark strong {
        font-size: 19px;
        letter-spacing: -0.6px;
      }
      .wordmark span {
        color: #8a9690;
        font-size: 12px;
        border-left: 1px solid #ccd6cf;
        padding-left: 17px;
        letter-spacing: 1px;
      }
      .demo-pill {
        font-size: 11px;
        letter-spacing: 1px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #789083;
        background: #e4ece6;
        border: 1px solid #d9e4dc;
        border-radius: 20px;
        padding: 8px 13px;
      }
      .demo-pill i {
        width: 5px;
        height: 5px;
        background: var(--green);
        border-radius: 50%;
      }
      .window {
        height: calc(100vh - 116px);
        max-width: 1452px;
        margin: 0 auto;
        border: 1px solid #d7e0da;
        border-radius: 12px;
        background: white;
        overflow: hidden;
        box-shadow:
          0 22px 70px #314b3d13,
          0 3px 12px #314b3d08;
      }
      .titlebar {
        height: 37px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: #f8f9f8;
        border-bottom: 1px solid #e8ede9;
        position: relative;
        user-select: none;
      }
      .traffic {
        display: flex;
        gap: 7px;
      }
      .traffic i {
        height: 10px;
        width: 10px;
        border-radius: 50%;
        background: #ff625a;
        border: 1px solid #e7554e;
      }
      .traffic i:nth-child(2) {
        background: #ffbf45;
        border-color: #edaf35;
      }
      .traffic i:nth-child(3) {
        background: #31c64f;
        border-color: #29b742;
      }
      .titlebar-name {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: #a1aaa4;
        letter-spacing: 2px;
      }
      .titlebar-end {
        margin-left: auto;
        font-size: 10px;
        color: #a1aaa4;
      }
      .app {
        height: calc(100% - 37px);
        display: flex;
      }
      .rail {
        width: 74px;
        background: var(--rail);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        flex-direction: column;
        padding: 25px 0 16px;
        gap: 9px;
      }
      .line-logo {
        width: 40px;
        height: 40px;
        background: var(--green);
        border-radius: 12px;
        display: grid;
        place-items: center;
        margin-bottom: 22px;
        color: white;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: -1px;
        position: relative;
      }
      .line-logo:after {
        content: "";
        position: absolute;
        bottom: 6px;
        left: 12px;
        border: 4px solid transparent;
        border-top-color: white;
        transform: rotate(14deg);
      }
      .line-logo span {
        background: white;
        color: var(--green);
        border-radius: 7px;
        padding: 3px 4px;
        font-size: 10px;
        line-height: 14px;
      }
      .rail-btn {
        position: relative;
        color: #a8b4ad;
        border-radius: 10px;
        width: 51px;
        min-height: 55px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      .rail-btn.active {
        background: #3c4d43;
        color: #77e6a5;
      }
      .rail-btn:hover {
        background: #35463c;
      }
      .rail-btn .navdot {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #0dcc77;
        right: 11px;
        top: 9px;
        border-radius: 50%;
        border: 2px solid #27342f;
      }
      .rail-spacer {
        flex: 1;
      }
      .rail-self {
        margin-top: 6px;
      }
      .rail-self .avatar {
        width: 30px;
        height: 30px;
      }
      .sidebar {
        width: 292px;
        flex-shrink: 0;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: white;
      }
      .side-top {
        padding: 28px 22px 17px;
      }
      .side-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 21px;
      }
      .side-title h1 {
        font-size: 21px;
        letter-spacing: 1px;
        margin: 0;
        font-weight: 650;
      }
      .side-buttons {
        display: flex;
        gap: 5px;
      }
      .icon-btn {
        width: 31px;
        height: 31px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        color: #77837b;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: #eef3ef;
        color: var(--ink);
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f3f5f3;
        border-radius: 7px;
        padding: 9px 11px;
        color: #a1aaa4;
      }
      .searchbox input {
        border: 0;
        background: transparent;
        min-width: 0;
        width: 100%;
        outline: none;
        font-size: 12px;
        color: #3e4b43;
      }
      .searchbox input:focus {
        outline: 0;
      }
      .searchbox input::placeholder {
        color: #a0a8a3;
      }
      .filter-row {
        display: flex;
        gap: 7px;
        margin-top: 15px;
      }
      .filter {
        border-radius: 5px;
        padding: 5px 12px;
        color: #98a29b;
        font-size: 11px;
      }
      .filter.active {
        background: #e8f8ef;
        color: var(--green-dark);
        font-weight: 600;
      }
      .filter:hover {
        background: #f2f6f3;
      }
      .chat-list {
        flex: 1;
        overflow: auto;
      }
      .list-label {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #a4aca7;
        padding: 10px 24px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .chat-row {
        display: flex;
        gap: 12px;
        padding: 17px 20px 17px 22px;
        text-align: left;
        width: 100%;
        position: relative;
        align-items: center;
        min-height: 82px;
        border-left: 3px solid transparent;
      }
      .chat-row:hover {
        background: #f7faf8;
      }
      .chat-row.active {
        background: #eef7f1;
        border-left-color: var(--green);
      }
      .avatar {
        width: 43px;
        height: 43px;
        border-radius: 16px;
        overflow: hidden;
        flex-shrink: 0;
        background: #e5ece6;
        display: inline-grid;
        place-items: center;
        font-weight: 600;
        color: #617967;
        font-size: 16px;
      }
      .avatar svg {
        width: 100%;
        height: 100%;
      }
      .avatar.group {
        background: #d9e9db;
      }
      .avatar.small {
        width: 29px;
        height: 29px;
        border-radius: 10px;
        font-size: 11px;
      }
      .avatar.large {
        width: 68px;
        height: 68px;
        border-radius: 23px;
      }
      .chat-row-info {
        min-width: 0;
        flex: 1;
      }
      .chat-row-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        margin-bottom: 7px;
      }
      .chat-name {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat-time {
        font-size: 9px;
        color: #a1aaa4;
        white-space: nowrap;
        font-weight: 400;
      }
      .chat-row-bottom {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .chat-preview {
        font-size: 10px;
        color: #9ba59e;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        flex: 1;
        line-height: 1.3;
      }
      .unread {
        background: #06b75e;
        border-radius: 20px;
        font-size: 9px;
        min-width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        color: white;
        padding: 0 4px;
      }
      .chat-row.active .chat-preview {
        color: #6c8a78;
      }
      .side-footer {
        padding: 16px 24px;
        font-size: 9px;
        letter-spacing: 1px;
        color: #a9b1ac;
        border-top: 1px solid #f3f5f3;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .side-footer i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #69bc8a;
      }
      .workspace {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chat-header {
        height: 85px;
        min-height: 85px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 27px;
        border-bottom: 1px solid var(--line);
        background: white;
      }
      .chat-heading {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
      }
      .chat-heading .avatar {
        width: 40px;
        height: 40px;
        border-radius: 13px;
      }
      .chat-title {
        font-size: 15px;
        font-weight: 650;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 240px;
      }
      .chat-subtitle {
        font-size: 10px;
        color: #a2aba5;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .chat-subtitle i {
        width: 4px;
        height: 4px;
        background: #74c995;
        border-radius: 50%;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .header-actions .divider {
        width: 1px;
        height: 20px;
        background: #edf0ed;
        margin: 0 2px;
      }
      .body-split {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .conversation {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
        background: var(--canvas);
      }
      .conversation-search {
        padding: 10px 20px;
        background: #f7faf9;
        border-bottom: 1px solid #dce6e0;
        display: none;
        gap: 10px;
        align-items: center;
      }
      .conversation-search.open {
        display: flex;
      }
      .conversation-search .searchbox {
        flex: 1;
        background: white;
      }
      .search-count {
        font-size: 10px;
        color: #788a7f;
        white-space: nowrap;
      }
      .messages {
        flex: 1;
        overflow: auto;
        padding: 23px 29px 13px;
        scroll-behavior: smooth;
      }
      .date-divider {
        display: flex;
        justify-content: center;
        margin: 0 0 23px;
      }
      .date-divider span {
        font-size: 9px;
        color: #81938a;
        background: #dce6e5a8;
        border-radius: 20px;
        padding: 5px 12px;
        letter-spacing: 0.6px;
      }
      .message {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-bottom: 18px;
        position: relative;
      }
      .message .avatar {
        margin-top: 18px;
        width: 28px;
        height: 28px;
        border-radius: 10px;
      }
      .message-main {
        max-width: 81%;
        min-width: 0;
      }
      .message-sender {
        font-size: 9px;
        color: #84948b;
        margin-bottom: 6px;
        padding-left: 2px;
        letter-spacing: 0.3px;
      }
      .message-line {
        display: flex;
        gap: 7px;
        align-items: flex-end;
      }
      .bubble {
        font-size: calc(var(--font) - 2px);
        border-radius: 2px 13px 13px 13px;
        background: white;
        padding: 11px 14px;
        line-height: 1.8;
        box-shadow: 0 1px 2px #142d1910;
        overflow-wrap: anywhere;
        min-width: 25px;
        position: relative;
      }
      .message.own {
        flex-direction: row-reverse;
        margin-top: 4px;
      }
      .message.own .message-line {
        flex-direction: row-reverse;
      }
      .message.own .message-main {
        max-width: 82%;
      }
      .message.own .bubble {
        background: #c9efbb;
        border-radius: 13px 2px 13px 13px;
        color: #34523b;
      }
      .message-meta {
        font-size: 8px;
        line-height: 1.6;
        color: #95a59d;
        white-space: nowrap;
        min-width: 25px;
        padding-bottom: 2px;
        text-align: right;
      }
      .message-meta .read {
        color: #78a38a;
        font-size: 8px;
      }
      .message-actions {
        opacity: 0;
        align-self: center;
        transition: opacity 0.15s;
        color: #80948a;
        background: #ffffff9c;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .message:hover .message-actions,
      .message:focus-within .message-actions {
        opacity: 1;
      }
      .bubble.image-bubble {
        padding: 0;
        overflow: hidden;
        background: #c9d9c9;
      }
      .image-collage {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 3px;
        width: 282px;
        max-width: 100%;
        height: 150px;
      }
      .image-collage svg {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .image-collage .mini-scenes {
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 3px;
        overflow: hidden;
      }
      .image-caption {
        padding: 9px 12px;
        font-size: 10px;
        color: #5c7263;
        background: white;
      }
      .attachment {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 215px;
        max-width: 100%;
        text-align: left;
      }
      .file-icon {
        height: 40px;
        width: 33px;
        background: #fdf1ed;
        border: 1px solid #f3d9d1;
        border-radius: 5px;
        color: #c77961;
        font-size: 9px;
        font-weight: 700;
        display: grid;
        place-items: center;
        position: relative;
      }
      .file-icon:after {
        content: "";
        position: absolute;
        right: -1px;
        top: -1px;
        width: 9px;
        height: 9px;
        background: #fff;
        border-left: 1px solid #f0d5cc;
        border-bottom: 1px solid #f0d5cc;
        border-radius: 0 3px 0 3px;
      }
      .file-name {
        font-size: 11px;
        font-weight: 600;
        max-width: 180px;
        word-break: break-word;
        line-height: 1.5;
      }
      .file-size {
        font-size: 9px;
        color: #9aa69d;
        margin-top: 4px;
        font-weight: 400;
      }
      .attachment .download {
        margin-left: auto;
        color: #90a297;
      }
      .sticker-bubble {
        padding: 0;
        background: none !important;
        box-shadow: none;
        width: 120px;
      }
      .sticker-bubble svg {
        width: 120px;
        height: 108px;
      }
      .retracted {
        color: #91a099;
        font-size: 10px;
        display: flex;
        justify-content: center;
        margin: 18px;
      }
      .reply-quote {
        background: #f1f5f1;
        border-left: 2px solid #9bc5a7;
        font-size: 10px;
        color: #8a9d90;
        padding: 6px 9px;
        margin: 0 0 8px;
        border-radius: 3px;
        max-width: 260px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .own .reply-quote {
        background: #b8dfa9;
        color: #63845d;
      }
      .reaction {
        position: absolute;
        bottom: -12px;
        left: 8px;
        background: white;
        border: 1px solid #e5ece6;
        border-radius: 20px;
        padding: 1px 5px;
        font-size: 10px;
        line-height: 16px;
        box-shadow: 0 1px 3px #223c2b0c;
      }
      .composer {
        background: white;
        border-top: 1px solid #e3e9e5;
        padding: 13px 23px 12px;
        flex-shrink: 0;
      }
      .composer-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .composer-toolbar .icon-btn {
        width: 26px;
        height: 28px;
        color: #899a8e;
      }
      .composer-toolbar .toolbar-end {
        margin-left: auto;
        color: #acb5ae;
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      .composer-input-row {
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }
      .composer textarea {
        font-size: calc(var(--font) - 2px);
        resize: none;
        border: none;
        outline: none !important;
        width: 100%;
        height: 49px;
        max-height: 110px;
        line-height: 1.7;
        padding: 8px 0;
        background: transparent;
        color: #405347;
      }
      .composer textarea::placeholder {
        color: #b0b9b2;
      }
      .send {
        background: var(--green);
        color: white;
        border-radius: 8px;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        margin-bottom: 7px;
        box-shadow: 0 3px 8px #02b65c22;
      }
      .send:disabled {
        background: #e5f3e9;
        color: #a3cbb0;
        box-shadow: none;
        opacity: 1;
      }
      .composer-hint {
        display: flex;
        justify-content: space-between;
        font-size: 8px;
        letter-spacing: 0.3px;
        color: #b4bdb6;
        margin-top: 1px;
      }
      .reply-composer {
        border-radius: 6px;
        background: #f2f7f2;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 11px;
        padding: 7px 10px;
        margin-bottom: 7px;
        color: #77917e;
      }
      .reply-composer span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .details {
        width: 254px;
        flex-shrink: 0;
        background: #fff;
        border-left: 1px solid var(--line);
        overflow: auto;
      }
      .detail-profile {
        text-align: center;
        padding: 29px 16px 23px;
      }
      .detail-profile .avatar {
        margin-bottom: 13px;
      }
      .detail-profile h2 {
        font-size: 13px;
        letter-spacing: 0.7px;
        margin: 0 0 8px;
        font-weight: 650;
      }
      .detail-profile p {
        font-size: 10px;
        color: #9ea89f;
        margin: 0;
      }
      .quick-actions {
        display: flex;
        justify-content: center;
        gap: 26px;
        padding: 0 13px 24px;
      }
      .quick-action {
        display: flex;
        flex-direction: column;
        gap: 7px;
        align-items: center;
        color: #8a988e;
        font-size: 9px;
      }
      .quick-circle {
        border: 1px solid #e6ece7;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        color: #899a8d;
      }
      .quick-action.on .quick-circle {
        color: var(--green);
        background: #eaf7ed;
        border-color: #d8efdf;
      }
      .detail-tabs {
        display: flex;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 0 10px;
        position: sticky;
        top: 0;
        background: white;
        z-index: 1;
      }
      .detail-tab {
        flex: 1;

      function makeDemoPDF() {
        const stream =
          "BT /F1 18 Tf 50 760 Td (Weekend Walk - DEMO) Tj 0 -35 Td /F1 12 Tf (This is a sample document from the LINE Desktop mockup.) Tj 0 -24 Td (Saturday 09:30 - Jiantan Station Exit 1) Tj 0 -24 Td (Bring water, a light jacket, and a good mood.) Tj 0 -40 Td (Offline demo only. No connection to LINE.) Tj ET";
        const objects = [
          "<< /Type /Catalog /Pages 2 0 R >>",
          "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
          "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
          "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,
        ];
        let pdf = "%PDF-1.4\n";
        const offsets = [0];
        objects.forEach((obj, i) => {
          offsets.push(pdf.length);
          pdf += `${i + 1} 0 obj\n${obj}\nendobj\n`;
        });
        const start = pdf.length;
        pdf += `xref\n0 6\n0000000000 65535 f \n${offsets
          .slice(1)
          .map((o) => String(o).padStart(10, "0") + " 00000 n \n")

            (n) => n.id === ui.modal.id,
          );
          n.liked = !n.liked;
          n.likes = (n.likes || 0) + (n.liked ? 1 : -1);
          renderModal();
          renderDetails();
        },
        "edit-modal-note": () => openModal({ ...ui.modal, kind: "note-edit" }),
        "delete-note": (el) =>
          openModal({
            kind: "note-delete",
            chatId: el.dataset.chat,
            id: el.dataset.id,
          }),
        "confirm-delete-note": () => {
          const m = ui.modal;
          chats[m.chatId].notes = chats[m.chatId].notes.filter(
            (n) => n.id !== m.id,
          );
          closeModal();
          renderDetails();
          toast("記事已刪除");
        },
        "new-album": () => openModal({ kind: "album-new", chatId: ui.chatId }),
        "choose-album-photos": () => {
          const title = $("#album-title").value.trim();
          if (!title) {
            $("#modal-error").textContent = "請為相簿取個名字。";
            return;
          }
          ui.pickerChatId = ui.modal.chatId;
          ui.pendingAlbum = { chatId: ui.modal.chatId, title };
          $("#album-input").value = "";
          $("#album-input").click();
        },
        "open-album": (el) => {
          const a = chats[el.dataset.chat].albums.find(
            (a) => a.id === el.dataset.id,
          );
          if (a?.photos.length)
            openModal({
              kind: "lightbox",
              photos: a.photos,
              title: a.title,
              index: Number(el.dataset.index) || 0,
            });
          else toast("這個相簿還沒有照片。");
        },
        "open-seed-photos": () =>
          openModal({
            kind: "lightbox",
            photos: [
              { scene: "mountain" },
              { scene: "trail" },
              { scene: "coffee" },
            ],
            title: "一些想和你分享的風景",
            index: 0,
          }),
        "open-image": (el) => {
          const m = chats[el.dataset.chat].messages.find(
            (m) => m.id === el.dataset.id,
          );
          openModal({
            kind: "lightbox",
            photos: [{ url: m.url, name: m.name }],
            title: m.name || "共享照片",
            index: 0,
          });
        },
        "photo-prev": () => {
          const m = ui.modal;
          m.index = (m.index + m.photos.length - 1) % m.photos.length;
          renderModal();
        },
        "photo-next": () => {
          const m = ui.modal;
          m.index = (m.index + 1) % m.photos.length;
          renderModal();
        },
        members: () => openModal({ kind: "members", chatId: ui.chatId }),
        "audio-call": () => startCall(ui.chatId, "audio"),
        "video-call": () => startCall(ui.chatId, "video"),
        redial: (el) => startCall(el.dataset.chat, el.dataset.kind),
        hangup: endCall,
        "call-toggle": (el) => {
          if (!call || call.phase === "ended") return;
          call[el.dataset.key] = !call[el.dataset.key];
          renderCallModal();
        },
        "call-again": () => startCall(call.chatId, call.kind),
        "message-menu": showMessageMenu,
        "reply-message": () => {
          const m = popMessage(),
            id = ui.popover.chatId;
          chats[id].reply = {
            id: m.id,
            name: contact(m.sender).name,
            text:
              m.kind === "text"
                ? m.text
                : m.kind === "sticker"
                  ? "[貼圖]"
                  : m.name || "[照片]",
          };
          closePopover();
          if (ui.chatId !== id) selectChat(id);
          renderReply();
          $("#message-input").focus();
        },
        "copy-message": () => {
          const m = popMessage();
          closePopover();
          copyText(m.text);
        },
        "react-message": () => {
          const m = popMessage();
          m.reaction = m.reaction ? "" : "💚";
          closePopover();
          renderMessages();
        },
        "retract-message": () => {
          const m = popMessage();
          if (m.sender === "me" && m.kind === "text") m.retracted = true;
          closePopover();
          renderMessages();
          renderList();
          toast("已收回這則本機訊息");
        },
        "forward-message": () => {
          const p = ui.popover;
          closePopover();
          openModal({ kind: "forward", chatId: p.chatId, id: p.messageId });
        },
        "confirm-forward": (el) => {
          const source = ui.modal;
          const original = chats[source.chatId].messages.find(
            (m) => m.id === source.id,
          );
          const target = el.dataset.chat;
          chats[target].messages.push({
            ...original,
            id: uid(),
            sender: "me",
            time: clock(),
            reaction: "",
            reply: null,
          });
          closeModal();
          toast(`已轉傳至「${chats[target].title}」`);
          renderList();
          if (ui.chatId === target) renderMessages(true);
        },
        settings: () => openModal({ kind: "settings", draft: { ...settings } }),
        "setting-toggle": (el) => {
          const draft = ui.modal.draft;
          draft[el.dataset.key] = !draft[el.dataset.key];
          el.classList.toggle("on", draft[el.dataset.key]);
          el.setAttribute("aria-pressed", draft[el.dataset.key]);
        },
        "save-settings": () => {
          const name = $("#settings-name").value.trim();
          if (!name) {
            $("#modal-error").textContent = "顯示名稱不能留白。";
            return;
          }
          settings = {
            ...ui.modal.draft,
            name,
            fontSize: $("#settings-font").value,
          };
          contacts[0].name = name;
          saveSettings();
          closeModal();
          renderNav();
          renderHeader();
          renderMessages();
          renderDetails();
          updateComposer();
          toast("個人設定已儲存");
        },
        help: () => openModal({ kind: "help" }),
        "close-modal": closeModal,
        screenshot: () => openModal({ kind: "screenshot", chatId: ui.chatId }),
        "send-screenshot": () => {
          const id = ui.modal.chatId;
          const blob = new Blob([scene()], { type: "image/svg+xml" }),
            url = URL.createObjectURL(blob);
          objectURLs.add(url);
          chats[id].messages.push(
            msg(uid(), "me", "", clock(), "image", {
              name: "風景擷取畫面（模擬）.svg",
              size: blob.size,
              url,
            }),
          );
          closeModal();
          renderList();
          if (ui.chatId === id) {
            renderMessages(true);
            renderDetails();
          }
          toast("已傳送模擬擷取畫面");
        },
      };
      document.addEventListener("click", (event) => {
        const el = event.target.closest("[data-action]");
        if (el && !el.disabled) {
          const action = actions[el.dataset.action];
          if (action) action(el, event);
        }
        if (
          !event.target.closest(".popover") &&
          !event.target.closest('[data-action="message-menu"]')
        )
          closePopover();
      });
      $("#list-search").addEventListener("input", (e) => {
        ui.listSearch = e.target.value;
        renderList();
        if (ui.section === "friends") renderAlternate();
      });
      $("#message-input").addEventListener("input", (e) => {
        currentChat().draft = e.target.value;
        $("#send-button").disabled = !e.target.value.trim();
      });
      $("#message-input").addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          !e.shiftKey &&
          !e.isComposing &&
          e.keyCode !== 229 &&
          settings.enterSend
        ) {
          e.preventDefault();
          sendMessage(ui.chatId, currentChat().draft);
        }
      });
      $("#message-search").addEventListener("input", (e) => {
        ui.messageSearch = e.target.value;
        renderMessages();
        const hit = $(".search-highlight");
        if (hit) hit.scrollIntoView({ block: "center", behavior: "smooth" });
      });
      $("#file-input").addEventListener("change", (e) =>
        queueFiles(e.target.files, ui.pickerChatId),
      );
      $("#photo-input").addEventListener("change", (e) =>
        queueFiles(e.target.files, ui.pickerChatId),
      );
      $("#album-input").addEventListener("change", (e) => {
        const album = ui.pendingAlbum;
        if (album) queueFiles(e.target.files, album.chatId, album);
        ui.pendingAlbum = null;
      });
      let dragDepth = 0;
      const conversation = $("#conversation");
      conversation.addEventListener("dragenter", (e) => {
        if (e.dataTransfer.types.includes("Files")) {
          e.preventDefault();
          dragDepth++;
          $("#drag-overlay").classList.add("show");
        }
      });
      conversation.addEventListener("dragover", (e) => {
        if (e.dataTransfer.types.includes("Files")) e.preventDefault();
      });
      conversation.addEventListener("dragleave", (e) => {
        e.preventDefault();
        if (--dragDepth <= 0) {
          dragDepth = 0;
          $("#drag-overlay").classList.remove("show");
        }
      });
      conversation.addEventListener("drop", (e) => {
        e.preventDefault();
        dragDepth = 0;
        $("#drag-overlay").classList.remove("show");
        queueFiles(e.dataTransfer.files, ui.chatId);
      });
      window.addEventListener("dragover", (e) => {
        if (e.dataTransfer.types.includes("Files")) e.preventDefault();
      });
      window.addEventListener("drop", (e) => e.preventDefault());
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if ($(".popover")) {
            closePopover();
            return;
          }
          if (ui.modal) {
            closeModal();
            return;
          }
          if ($("#conversation-search").classList.contains("open"))
            actions["close-search"]();
        }
        if (ui.modal && e.key === "Tab") {
          const els = Array.from(
            $("#modal-root").querySelectorAll(
              'button:not([disabled]),a,input,textarea,select,[tabindex="0"]',
            ),
          ).filter((el) => el.getClientRects().length);
          if (!els.length) return;
          const first = els[0],
            last = els.at(-1);
          if (!els.includes(document.activeElement)) {
            e.preventDefault();
            (e.shiftKey ? last : first).focus();
          } else if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
        if (ui.modal?.kind === "lightbox") {
          if (e.key === "ArrowLeft") actions["photo-prev"]();
          if (e.key === "ArrowRight") actions["photo-next"]();
        }
      });
      window.addEventListener("beforeunload", () =>
        objectURLs.forEach((url) => URL.revokeObjectURL(url)),
      );
      matchMedia("(min-width:1151px)").addEventListener("change", (e) => {
        ui.details = e.matches;
        renderHeader();
        renderDetails();
      });
      saveSettings();
      hydrateIcons();
      renderNav();
      renderSidebar();
      renderConversation(true);
    </script>
  </body>
</html>
